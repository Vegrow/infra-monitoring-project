name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh

      - name: Make scripts executable
        run: chmod +x check_api.sh analyze_logs.sh

      - name: Test API monitor (expect return code 0)
        run: ./check_api.sh https://httpbin.org/status/200
